<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師個人時間表 (自動單雙週)</title>
    <!-- 引入 PapaParse 用於解析 CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #status-bar {
            font-size: 0.95rem;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 4px;
            background-color: #e2e8f0;
        }
        .date-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .date-picker-wrapper input[type="date"] {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
            font-size: 0.9rem;
            height: 60px;
            width: 16.66%;
        }
        th {
            background-color: #1e293b;
            color: #fff;
        }
        /* 當日直欄放大與加粗 */
        th.highlight-col-header {
            background-color: #0284c7 !important;
            font-size: 1rem;
        }
        td.highlight-col {
            font-weight: bold;
            font-size: 0.98rem;
            background-color: #f8fafc;
        }
        .time-col {
            background-color: #f1f5f9;
            font-weight: bold;
            width: 120px;
        }
        /* 樣式設定 */
        .free-slot {
            background-color: #fef08a !important; /* 黃色空堂，不顯示文字 */
            color: transparent !important;
        }
        .inactive-class {
            background-color: #fef08a !important; /* 非當週或上學期完結變黃色、淺色字 */
            color: #94a3b8 !important;            
        }
        .active-class {
            background-color: #ffffff;
            color: #0f172a;
        }
        /* 當刻正在進行的課堂醒目標示 */
        .current-active-class {
            border: 3px solid #ef4444 !important;
            box-shadow: inset 0 0 8px rgba(239, 68, 68, 0.4);
            background-color: #fff1f2 !important;
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #ef4444; }
            50% { border-color: #fca5a5; }
            100% { border-color: #ef4444; }
        }
        .holiday-notice {
            text-align: center;
            padding: 15px;
            background-color: #fef9c3;
            border: 1px solid #fde047;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #854d0e;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>教師個人自動時間表</h1>
        <div class="header-controls">
            <div class="date-picker-wrapper">
                <label for="date-select">查詢日期:</label>
                <input type="date" id="date-select" onchange="onDateChanged()">
            </div>
            <div id="status-bar">載入中...</div>
        </div>
    </header>

    <div id="notice-container"></div>
    <div id="table-container">載入時間表中...</div>
</div>

<script>
const monthMap = {
    '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6,
    '七': 7, '八': 8, '九': 9, '十': 10, '十一': 11, '十二': 12
};

// 星期對應 timetable.csv 的表頭名稱
const dayIndexToHeader = {
    1: '星期一',
    3: '星期三',
    4: '星期四',
    5: '星期五'
};

let globalCalendarData = null;
let globalTimetableData = null;
let isUserSelectedDate = false;

async function loadTimetableAndCalendar() {
    try {
        const [calRes, timeRes] = await Promise.all([
            fetch('calendar.csv?' + new Date().getTime()),
            fetch('timetable.csv?' + new Date().getTime())
        ]);

        const calText = await calRes.text();
        const timeText = await timeRes.text();

        Papa.parse(calText, {
            header: false,
            skipEmptyLines: false,
            complete: function(calResults) {
                Papa.parse(timeText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(timeResults) {
                        globalCalendarData = calResults.data;
                        globalTimetableData = timeResults.data;
                        
                        // 初始化日期選擇器 (若尚未手動選擇)
                        const dateInput = document.getElementById('date-select');
                        if (!isUserSelectedDate) {
                            const today = new Date();
                            dateInput.value = formatDateString(today);
                        }
                        
                        renderSchedule();
                    }
                });
            }
        });
    } catch (error) {
        document.getElementById('status-bar').innerText = '載入檔案失敗';
        document.getElementById('table-container').innerText = '無法讀取 calendar.csv 或 timetable.csv，請確認它們與 index.html 放在同一 GitHub 資料夾內。';
        console.error(error);
    }
}

function formatDateString(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function onDateChanged() {
    isUserSelectedDate = true;
    renderSchedule();
}

// 檢查當前時間是否在時段內 (格式如 "09:40-10:15")
function isCurrentTimeInRange(timeStr, targetDateStr) {
    const now = new Date();
    const todayStr = formatDateString(now);
    if (targetDateStr !== todayStr) return false; // 只有檢視今天才醒目標示當刻課堂

    if (!timeStr || !timeStr.includes('-')) return false;
    const parts = timeStr.split('-');
    const startTime = parts[0].trim();
    const endTime = parts[1].trim();

    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    
    const parseMin = (tStr) => {
        const [hh, mm] = tStr.split(':').map(Number);
        return hh * 60 + mm;
    };

    const startMin = parseMin(startTime);
    const endMin = parseMin(endTime);

    return currentMinutes >= startMin && currentMinutes <= endMin;
}

function renderSchedule() {
    if (!globalCalendarData || !globalTimetableData) return;

    const dateInputVal = document.getElementById('date-select').value;
    const selectedDate = dateInputVal ? new Date(dateInputVal + 'T00:00:00') : new Date();
    
    const targetYear = selectedDate.getFullYear();
    const targetMonth = selectedDate.getMonth() + 1;
    const targetDay = selectedDate.getDate();
    const targetDayOfWeek = selectedDate.getDay(); // 0:日, 1:一, 2:二, 3:三, 4:四, 5:五, 6:六

    const isAfterFeb13 = (targetMonth > 2) || (targetMonth === 2 && targetDay >= 13);

    let matchedWeekNum = null;
    let currentWeekType = '未知';
    let activeMonthNum = 0;
    
    // 尋找 calendar.csv 裡的對應週數
    for (let i = 2; i < globalCalendarData.length; i++) {
        const row = globalCalendarData[i];
        if (!row || row.length < 9) continue;
        
        const weekNumStr = row[0] ? row[0].trim() : '';
        const monthStr = row[1] ? row[1].trim() : '';
        
        if (monthStr !== '') {
            activeMonthNum = monthMap[monthStr] || activeMonthNum;
        }
        
        for (let dayCol = 2; dayCol <= 8; dayCol++) {
            const dayVal = row[dayCol] ? row[dayCol].trim() : '';
            if (dayVal !== '') {
                const dNum = parseInt(dayVal, 10);
                if (dNum === targetDay && activeMonthNum === targetMonth) {
                    if (weekNumStr !== '') {
                        matchedWeekNum = parseInt(weekNumStr, 10);
                    }
                    break;
                }
            }
        }
        if (matchedWeekNum !== null) break;
    }

    const statusBar = document.getElementById('status-bar');
    const noticeContainer = document.getElementById('notice-container');

    if (isAfterFeb13 && targetMonth === 2) {
        noticeContainer.innerHTML = `<div class="holiday-notice">提示：已過 2月13日，標示 [上學期] 的課堂已轉為黃色空堂。</div>`;
    } else {
        noticeContainer.innerHTML = '';
    }

    let isOddWeek = false;
    if (matchedWeekNum !== null) {
        if (matchedWeekNum % 2 !== 0) {
            isOddWeek = true;
            currentWeekType = `第 ${matchedWeekNum} 週 (單週)`;
        } else {
            isOddWeek = false;
            currentWeekType = `第 ${matchedWeekNum} 週 (雙週)`;
        }
    } else {
        currentWeekType = '假期 / 未對應到日曆';
    }

    statusBar.innerHTML = `週期: <span style="color: #2563eb;">${currentWeekType}</span>`;

    // 找出當天對應 timetable 的欄位名稱
    const targetHeaderName = dayIndexToHeader[targetDayOfWeek];

    let html = '<table>';
    
    if (globalTimetableData.length > 0) {
        const headerRow = globalTimetableData[0];
        
        // 找出當天對應的 column index
        let targetColIndex = -1;
        for (let j = 0; j < headerRow.length; j++) {
            if (headerRow[j].trim() === targetHeaderName) {
                targetColIndex = j;
                break;
            }
        }

        // 表頭
        html += '<thead><tr>';
        for (let j = 0; j < headerRow.length; j++) {
            let isTargetCol = (j === targetColIndex);
            let thClass = isTargetCol ? 'highlight-col-header' : '';
            html += `<th class="${thClass}">${headerRow[j]} ${isTargetCol ? '(今日)' : ''}</th>`;
        }
        html += '</tr></thead><tbody>';

        // 表身
        for (let i = 1; i < globalTimetableData.length; i++) {
            html += '<tr>';
            const rowData = globalTimetableData[i];
            const timeSlotStr = rowData[0] ? rowData[0].trim() : '';

            for (let j = 0; j < rowData.length; j++) {
                let cellContent = rowData[j] ? rowData[j].trim() : '';
                let isTargetCol = (j === targetColIndex);
                let colClass = isTargetCol ? 'highlight-col' : '';

                if (j === 0) {
                    html += `<td class="time-col ${colClass}">${cellContent}</td>`;
                } else {
                    const isMarkedOdd = cellContent.includes('單週');
                    const isMarkedEven = cellContent.includes('雙週');
                    const isMarkedSemester1 = cellContent.includes('[上學期]');
                    const isEmptySlot = (cellContent === '' || cellContent === '(空堂)');

                    // 檢查是否為當刻正上緊的課堂
                    const isCurrentLiveClass = isTargetCol && isCurrentTimeInRange(timeSlotStr, dateInputVal);
                    let liveClassClass = isCurrentLiveClass ? 'current-active-class' : '';

                    if (isEmptySlot) {
                        // 空堂或 (空堂)：不顯示文字，變成黃色格
                        html += `<td class="free-slot ${colClass} ${liveClassClass}"></td>`;
                    } else if (isAfterFeb13 && targetMonth === 2 && isMarkedSemester1) {
                        // 2月13日後上學期課堂變黃色
                        html += `<td class="inactive-class ${colClass} ${liveClassClass}" title="上學期專用課程（現已完結）">${cellContent}</td>`;
                    } else if (matchedWeekNum !== null && isOddWeek && isMarkedEven && !isMarkedOdd) {
                        // 單週遇到雙週課 -> 黃色、淺字
                        html += `<td class="inactive-class ${colClass} ${liveClassClass}" title="雙週課程（本週不上）">${cellContent}</td>`;
                    } else if (matchedWeekNum !== null && !isOddWeek && isMarkedOdd && !isMarkedEven) {
                        // 雙週遇到單週課 -> 黃色、淺字
                        html += `<td class="inactive-class ${colClass} ${liveClassClass}" title="單週課程（本週不上）">${cellContent}</td>`;
                    } else {
                        // 正常上課
                        html += `<td class="active-class ${colClass} ${liveClassClass}">${cellContent}</td>`;
                    }
                }
            }
            html += '</tr>';
        }
        html += '</tbody>';
    } else {
        html += '<tr><td>時間表資料為空</td></tr>';
    }
    html += '</table>';

    document.getElementById('table-container').innerHTML = html;
}

// 頁面載入時執行
loadTimetableAndCalendar();

// 每 5 分鐘自動重新整理一次
setInterval(() => {
    loadTimetableAndCalendar();
}, 300000);
</script>

</body>
</html>
