<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人時間表</title>
    <!-- 引入 PapaParse 用於解析 CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        #status-bar {
            font-size: 1rem;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 4px;
            background-color: #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
            font-size: 0.9rem;
            height: 60px;
            width: 16.66%;
        }
        th {
            background-color: #1e293b;
            color: #fff;
        }
        .time-col {
            background-color: #f1f5f9;
            font-weight: bold;
            width: 120px;
        }
        /* 樣式設定：依要求將空堂或非當週課堂轉黃色，文字淺色 */
        .free-slot {
            background-color: #fef08a !important; /* 空白格黃色 */
            color: #333 !important;
        }
        .inactive-class {
            background-color: #fef08a !important; /* 非當週或上學期完結的課堂變黃色 */
            color: #94a3b8 !important;            /* 字體變成淺色 */
        }
        .active-class {
            background-color: #ffffff;
            color: #0f172a;
        }
        .holiday-notice {
            text-align: center;
            padding: 15px;
            background-color: #fef9c3;
            border: 1px solid #fde047;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #854d0e;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>教師個人自動時間表</h1>
        <div id="status-bar">載入中...</div>
    </header>

    <div id="notice-container"></div>
    <div id="table-container">載入時間表中...</div>
</div>

<script>
// 中文月份對應數字
const monthMap = {
    '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6,
    '七': 7, '八': 8, '九': 9, '十': 10, '十一': 11, '十二': 12
};

async function loadTimetableAndCalendar() {
    try {
        const [calRes, timeRes] = await Promise.all([
            fetch('calendar.csv?' + new Date().getTime()),
            fetch('timetable.csv?' + new Date().getTime())
        ]);

        const calText = await calRes.text();
        const timeText = await timeRes.text();

        Papa.parse(calText, {
            header: false,
            skipEmptyLines: false, // 保留完整行以便準確對應 A3-A64
            complete: function(calResults) {
                Papa.parse(timeText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(timeResults) {
                        renderSchedule(calResults.data, timeResults.data);
                    }
                });
            }
        });
    } catch (error) {
        document.getElementById('status-bar').innerText = '載入檔案失敗';
        document.getElementById('table-container').innerText = '無法讀取 calendar.csv 或 timetable.csv，請確認它們與 index.html 放在同一 GitHub 資料夾內。';
        console.error(error);
    }
}

function renderSchedule(calendarRows, timetableData) {
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth() + 1; // 1-12
    const currentDate = now.getDate();
    
    // 檢查是否為 2月13日或之後
    const isAfterFeb13 = (currentMonth > 2) || (currentMonth === 2 && currentDate >= 13);

    let matchedWeekNum = null;
    let currentWeekType = '未知';
    let activeMonthNum = 0;
    
    // 依照你的說明：從 A3 到 A64 (陣列索引 2 到 63)
    for (let i = 2; i < calendarRows.length; i++) {
        const row = calendarRows[i];
        if (!row || row.length < 9) continue;
        
        const weekNumStr = row[0] ? row[0].trim() : '';
        const monthStr = row[1] ? row[1].trim() : '';
        
        if (monthStr !== '') {
            activeMonthNum = monthMap[monthStr] || activeMonthNum;
        }
        
        // 檢查星期一至星期日 (對應 CSV 欄位索引 2 至 8，即 M 至 S)
        for (let dayCol = 2; dayCol <= 8; dayCol++) {
            const dayVal = row[dayCol] ? row[dayCol].trim() : '';
            if (dayVal !== '') {
                const dNum = parseInt(dayVal, 10);
                if (dNum === currentDate && activeMonthNum === currentMonth) {
                    if (weekNumStr !== '') {
                        matchedWeekNum = parseInt(weekNumStr, 10);
                    }
                    break;
                }
            }
        }
        if (matchedWeekNum !== null) break;
    }

    const statusBar = document.getElementById('status-bar');
    const noticeContainer = document.getElementById('notice-container');

    if (isAfterFeb13 && currentMonth === 2) {
        noticeContainer.innerHTML = `<div class="holiday-notice">提示：已過 2月13日，標示 [上學期] 的課堂已轉為黃色空堂。</div>`;
    } else {
        noticeContainer.innerHTML = '';
    }

    let isOddWeek = false;
    if (matchedWeekNum !== null) {
        // 單數週即單週，雙數週即雙週
        if (matchedWeekNum % 2 !== 0) {
            isOddWeek = true;
            currentWeekType = `第 ${matchedWeekNum} 週 (單週)`;
        } else {
            isOddWeek = false;
            currentWeekType = `第 ${matchedWeekNum} 週 (雙週)`;
        }
    } else {
        currentWeekType = '假期 / 未對應到日曆';
    }

    const todayStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(currentDate).padStart(2, '0')}`;
    statusBar.innerHTML = `今日: ${todayStr} | 週期: <span style="color: #2563eb;">${currentWeekType}</span>`;

    let html = '<table>';
    
    if (timetableData.length > 0) {
        html += '<thead><tr>';
        for (let cell of timetableData[0]) {
            html += `<th>${cell}</th>`;
        }
        html += '</tr></thead><tbody>';

        for (let i = 1; i < timetableData.length; i++) {
            html += '<tr>';
            for (let j = 0; j < timetableData[i].length; j++) {
                let cellContent = timetableData[i][j] ? timetableData[i][j].trim() : '';
                
                if (j === 0) {
                    html += `<td class="time-col">${cellContent}</td>`;
                } else {
                    const isMarkedOdd = cellContent.includes('單週');
                    const isMarkedEven = cellContent.includes('雙週');
                    const isMarkedSemester1 = cellContent.includes('[上學期]');

                    if (cellContent === '') {
                        // 1. 本身空白的格子 -> 黃色
                        html += `<td class="free-slot"></td>`;
                    } else if (isAfterFeb13 && currentMonth === 2 && isMarkedSemester1) {
                        // 2. 2月13日後，標示 [上學期] 的格成黃色，文字淺色
                        html += `<td class="inactive-class" title="上學期專用課程（現已完結）">${cellContent}</td>`;
                    } else if (matchedWeekNum !== null && isOddWeek && isMarkedEven && !isMarkedOdd) {
                        // 3. 【單週】時：標註「雙週」的格子轉黃色並讓文字變淺色
                        html += `<td class="inactive-class" title="雙週課程（本週不上）">${cellContent}</td>`;
                    } else if (matchedWeekNum !== null && !isOddWeek && isMarkedOdd && !isMarkedEven) {
                        // 4. 【雙週】時：標註「單週」的格子轉黃色並讓文字變淺色
                        html += `<td class="inactive-class" title="單週課程（本週不上）">${cellContent}</td>`;
                    } else {
                        // 5. 其餘正常顯示
                        html += `<td class="active-class">${cellContent}</td>`;
                    }
                }
            }
            html += '</tr>';
        }
        html += '</tbody>';
    } else {
        html += '<tr><td>時間表資料為空</td></tr>';
    }
    html += '</table>';

    document.getElementById('table-container').innerHTML = html;
}

// 頁面載入時執行
loadTimetableAndCalendar();

// 每 5 分鐘 (300,000 毫秒) 自動重新整理一次
setInterval(() => {
    loadTimetableAndCalendar();
}, 300000);
</script>

</body>
</html>
