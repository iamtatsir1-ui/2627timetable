<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師個人時間表 (自動單雙週)</title>
    <!-- 引入 PapaParse 用於解析 CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        #status-bar {
            font-size: 0.95rem;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 4px;
            background-color: #e2e8f0;
        }
        .date-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .date-picker-wrapper input[type="date"] {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
            font-size: 0.9rem;
            height: 60px;
            width: 16.66%;
        }
        th {
            background-color: #1e293b;
            color: #fff;
        }
        /* 當日直欄放大與加粗 */
        th.highlight-col-header {
            background-color: #0284c7 !important;
            font-size: 1rem;
        }
        td.highlight-col {
            font-weight: bold;
            font-size: 0.98rem;
            background-color: #f8fafc;
        }
        .time-col {
            background-color: #f1f5f9;
            font-weight: bold;
            width: 120px;
        }
        /* 空堂或非當週課堂轉為黃色且隱藏文字 */
        .free-slot {
            background-color: #fef08a !important; 
            color: transparent !important;
        }
        .active-class {
            background-color: #ffffff;
            color: #0f172a;
        }
        /* 當刻正在進行的課堂醒目標示 */
        .current-active-class {
            border: 3px solid #ef4444 !important;
            box-shadow: inset 0 0 8px rgba(239, 68, 68, 0.4);
            background-color: #fff1f2 !important;
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #ef4444; }
            50% { border-color: #fca5a5; }
            100% { border-color: #ef4444; }
        }
        .holiday-notice {
            text-align: center;
            padding: 15px;
            background-color: #fef9c3;
            border: 1px solid #fde047;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #854d0e;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>教師個人自動時間表</h1>
        <div class="header-controls">
            <div class="date-picker-wrapper">
                <label for="date-select">查詢日期:</label>
                <input type="date" id="date-select" onchange="onDateChanged()">
            </div>
            <div id="status-bar">載入中...</div>
        </div>
    </header>

    <div id="notice-container"></div>
    <div id="table-container">載入時間表中...</div>
</div>

<script>
const dayIndexToHeader = {
    1: '星期一',
    2: '星期二',
    3: '星期三',
    4: '星期四',
    5: '星期五'
};

let globalCalendarMap = {}; // "YYYY-MM-DD" -> { weekNum: number, weekType: string }
let globalTimetableData = null;
let isUserSelectedDate = false;

function cleanCell(val) {
    if (!val) return '';
    return String(val).replace(/^\ufeff/, '').trim();
}

async function loadTimetableAndCalendar() {
    try {
        const [calRes, timeRes] = await Promise.all([
            fetch('calendar.csv?' + new Date().getTime()),
            fetch('timetable.csv?' + new Date().getTime())
        ]);

        const calText = await calRes.text();
        const timeText = await timeRes.text();

        Papa.parse(calText, {
            header: false,
            skipEmptyLines: false,
            complete: function(calResults) {
                Papa.parse(timeText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(timeResults) {
                        parseCalendarData(calResults.data);
                        globalTimetableData = timeResults.data;
                        
                        const dateInput = document.getElementById('date-select');
                        if (!isUserSelectedDate || !dateInput.value) {
                            const today = new Date();
                            dateInput.value = formatDateString(today);
                        }
                        
                        renderSchedule();
                    }
                });
            }
        });
    } catch (error) {
        document.getElementById('status-bar').innerText = '載入檔案失敗';
        document.getElementById('table-container').innerText = '無法讀取 calendar.csv 或 timetable.csv，請確認它們與 index.html 放在同一資料夾內。';
        console.error(error);
    }
}

// 解析阿拉伯數字、中文、英文月份
function parseMonth(str) {
    if (!str) return null;
    str = cleanCell(str);
    let numMatch = str.match(/^(\d{1,2})/);
    if (numMatch) {
        let m = parseInt(numMatch[1], 10);
        if (m >= 1 && m <= 12) return m;
    }
    const monthMap = {
        '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6,
        '七': 7, '八': 8, '九': 9, '十': 10, '十一': 11, '十二': 12
    };
    for (let key in monthMap) {
        if (str.startsWith(key)) return monthMap[key];
    }
    const engMonths = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
    let lower = str.toLowerCase();
    for (let idx = 0; idx < engMonths.length; idx++) {
        if (lower.startsWith(engMonths[idx])) return idx + 1;
    }
    return null;
}

// 自動對應 YYYY-MM-DD -> 週次及單雙週
function parseCalendarData(rows) {
    globalCalendarMap = {};
    if (!rows || rows.length === 0) return;

    // 1. 嘗試解析「日期清單格式」（例如: 日期, 週次, 單雙週）
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;

        const c0 = cleanCell(row[0]);
        const c1 = cleanCell(row[1]);

        // 比對 YYYY-MM-DD 或 YYYY/MM/DD
        const dateMatch = c0.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
        if (dateMatch) {
            const y = dateMatch[1];
            const m = String(dateMatch[2]).padStart(2, '0');
            const d = String(dateMatch[3]).padStart(2, '0');
            const dateKey = `${y}-${m}-${d}`;

            let wNum = null;
            const wMatch = c1.match(/\d+/);
            if (wMatch) wNum = parseInt(wMatch[0], 10);

            let weekTypeStr = cleanCell(row[2]);
            if (!weekTypeStr && wNum !== null) {
                weekTypeStr = (wNum % 2 !== 0) ? '單週' : '雙週';
            }

            if (wNum !== null) {
                globalCalendarMap[dateKey] = {
                    weekNum: wNum,
                    weekType: weekTypeStr
                };
            }
        }
    }

    // 若成功以清單格式解析出資料，則直接結束
    if (Object.keys(globalCalendarMap).length > 0) return;

    // 2. 矩陣型日曆格式解析（週次, 月份, 日期1, 日期2...）
    let firstMonth = null;
    for (let i = 0; i < rows.length; i++) {
        if (!rows[i] || rows[i].length < 2) continue;
        let m = parseMonth(rows[i][1]);
        if (m !== null) {
            firstMonth = m;
            break;
        }
    }
    if (firstMonth === null) firstMonth = 9;

    const now = new Date();
    const nowYear = now.getFullYear();
    const nowMonth = now.getMonth() + 1;

    let runningYear = nowYear;
    if (firstMonth >= 8) {
        runningYear = (nowMonth >= 8) ? nowYear : nowYear - 1;
    }

    let lastKnownMonth = null;
    let lastKnownWeekNum = null;
    let prevMonth = null;

    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length < 3) continue;

        const weekNumStr = cleanCell(row[0]);
        const monthStr = cleanCell(row[1]);

        if (weekNumStr !== '') {
            let wMatch = weekNumStr.match(/\d+/);
            if (wMatch) lastKnownWeekNum = parseInt(wMatch[0], 10);
        }

        if (monthStr !== '') {
            let parsedM = parseMonth(monthStr);
            if (parsedM !== null) lastKnownMonth = parsedM;
        }

        if (lastKnownMonth === null || lastKnownWeekNum === null) continue;

        if (prevMonth !== null && lastKnownMonth < prevMonth && prevMonth >= 9) {
            runningYear++;
        }
        prevMonth = lastKnownMonth;

        for (let dayCol = 2; dayCol < row.length; dayCol++) {
            const dayVal = cleanCell(row[dayCol]);
            if (dayVal !== '') {
                const dNum = parseInt(dayVal, 10);
                if (!isNaN(dNum) && dNum >= 1 && dNum <= 31) {
                    const mmStr = String(lastKnownMonth).padStart(2, '0');
                    const ddStr = String(dNum).padStart(2, '0');
                    const dateKey = `${runningYear}-${mmStr}-${ddStr}`;
                    
                    globalCalendarMap[dateKey] = {
                        weekNum: lastKnownWeekNum,
                        weekType: (lastKnownWeekNum % 2 !== 0) ? '單週' : '雙週'
                    };
                }
            }
        }
    }
}

function formatDateString(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function onDateChanged() {
    isUserSelectedDate = true;
    renderSchedule();
}

function isCurrentTimeInRange(timeStr, targetDateStr) {
    const now = new Date();
    const todayStr = formatDateString(now);
    if (targetDateStr !== todayStr) return false;

    if (!timeStr || !timeStr.includes('-')) return false;
    const parts = timeStr.split('-');
    const startTime = cleanCell(parts[0]);
    const endTime = cleanCell(parts[1]);

    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    
    const parseMin = (tStr) => {
        const [hh, mm] = tStr.split(':').map(Number);
        return hh * 60 + mm;
    };

    const startMin = parseMin(startTime);
    const endMin = parseMin(endTime);

    return currentMinutes >= startMin && currentMinutes <= endMin;
}

function renderSchedule() {
    if (!globalTimetableData) return;

    const dateInputVal = document.getElementById('date-select').value;
    const selectedDate = dateInputVal ? new Date(dateInputVal + 'T00:00:00') : new Date();
    
    const targetMonth = selectedDate.getMonth() + 1;
    const targetDay = selectedDate.getDate();
    const targetDayOfWeek = selectedDate.getDay();

    const isAfterFeb13 = (targetMonth > 2) || (targetMonth === 2 && targetDay >= 13);

    const weekInfo = globalCalendarMap[dateInputVal];
    let matchedWeekNum = weekInfo ? weekInfo.weekNum : null;
    let matchedWeekTypeStr = weekInfo ? weekInfo.weekType : '';

    let currentWeekType = '未知';
    let isOddWeek = false;

    if (matchedWeekNum !== null) {
        if (matchedWeekTypeStr.includes('單')) {
            isOddWeek = true;
        } else if (matchedWeekTypeStr.includes('雙')) {
            isOddWeek = false;
        } else {
            isOddWeek = (matchedWeekNum % 2 !== 0);
        }
        currentWeekType = `第 ${matchedWeekNum} 週 (${isOddWeek ? '單週' : '雙週'})`;
    } else {
        currentWeekType = '假期 / 未對應到日曆';
    }

    const statusBar = document.getElementById('status-bar');
    const noticeContainer = document.getElementById('notice-container');

    if (isAfterFeb13) {
        noticeContainer.innerHTML = `<div class="holiday-notice">提示：已進入下學期（2月13日後），標示 [上學期] 的課堂已自動隱藏/轉為空堂。</div>`;
    } else {
        noticeContainer.innerHTML = '';
    }

    statusBar.innerHTML = `${dateInputVal} | 週期: <span style="color: #2563eb;">${currentWeekType}</span>`;

    const targetHeaderName = dayIndexToHeader[targetDayOfWeek];

    let html = '<table>';
    
    if (globalTimetableData.length > 0) {
        let rawHeader = globalTimetableData[0];
        let standardHeaders = ['時間', '星期一', '星期二', '星期三', '星期四', '星期五'];
        
        let headerMap = {};
        for (let j = 1; j < rawHeader.length; j++) {
            let hName = cleanCell(rawHeader[j]);
            headerMap[hName] = j;
        }

        html += '<thead><tr>';
        for (let h of standardHeaders) {
            let isTargetCol = (h === targetHeaderName);
            let thClass = isTargetCol ? 'highlight-col-header' : '';
            let displayName = h === '時間' ? '時間 / 星期' : `${h} ${isTargetCol ? '(今日)' : ''}`;
            html += `<th class="${thClass}">${displayName}</th>`;
        }
        html += '</tr></thead><tbody>';

        for (let i = 1; i < globalTimetableData.length; i++) {
            html += '<tr>';
            const rowData = globalTimetableData[i];
            const timeSlotStr = rowData[0] ? cleanCell(rowData[0]) : '';

            for (let colIdx = 0; colIdx < standardHeaders.length; colIdx++) {
                let hName = standardHeaders[colIdx];
                let isTargetCol = (hName === targetHeaderName);
                let colClass = isTargetCol ? 'highlight-col' : '';

                if (colIdx === 0) {
                    html += `<td class="time-col ${colClass}">${timeSlotStr}</td>`;
                } else {
                    let rawColIndex = headerMap[hName];
                    let cellContent = (rawColIndex !== undefined && rowData[rawColIndex]) ? cleanCell(rowData[rawColIndex]) : '';

                    const isMarkedOdd = cellContent.includes('單週');
                    const isMarkedEven = cellContent.includes('雙週');
                    const isMarkedSemester1 = cellContent.includes('[上學期]');
                    const isEmptySlot = (cellContent === '' || cellContent === '(空堂)');

                    const isCurrentLiveClass = isTargetCol && isCurrentTimeInRange(timeSlotStr, dateInputVal);
                    let liveClassClass = isCurrentLiveClass ? 'current-active-class' : '';

                    let shouldHide = false;
                    let tooltipMsg = '';

                    if (isEmptySlot) {
                        shouldHide = true;
                    } else if (isAfterFeb13 && isMarkedSemester1) {
                        shouldHide = true;
                        tooltipMsg = '上學期專用課程（現已完結）';
                    } else if (matchedWeekNum !== null && isOddWeek && isMarkedEven && !isMarkedOdd) {
                        shouldHide = true;
                        tooltipMsg = '雙週課程（本週單週不上）';
                    } else if (matchedWeekNum !== null && !isOddWeek && isMarkedOdd && !isMarkedEven) {
                        shouldHide = true;
                        tooltipMsg = '單週課程（本週雙週不上）';
                    }

                    if (shouldHide) {
                        html += `<td class="free-slot ${colClass} ${liveClassClass}" title="${tooltipMsg}"></td>`;
                    } else {
                        html += `<td class="active-class ${colClass} ${liveClassClass}">${cellContent}</td>`;
                    }
                }
            }
            html += '</tr>';
        }
        html += '</tbody>';
    } else {
        html += '<tr><td>時間表資料為空</td></tr>';
    }
    html += '</table>';

    document.getElementById('table-container').innerHTML = html;
}

loadTimetableAndCalendar();

setInterval(() => {
    loadTimetableAndCalendar();
}, 300000);
</script>

</body>
</html>
