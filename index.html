<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單雙週狀態查詢</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .date-display {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 0.5rem;
        }
        .status {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1677ff;
            margin: 1rem 0;
        }
        .error {
            color: #ff4d4f;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="date-display" id="today-date">今日日期載入中...</div>
        <div id="result" class="status">讀取中...</div>
    </div>

    <script>
        async function loadCalendar() {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('today-date').textContent = `今天是：${todayStr}`;

            try {
                // 讀取同一層目錄下的 calendar.csv
                const response = await fetch('calendar.csv', { cache: 'no-cache' });
                if (!response.ok) throw new Error('無法讀取 CSV 檔案');

                const text = await response.text();
                const lines = text.trim().split('\n');

                // 解析 CSV 資料（排除標頭）
                const records = lines.slice(1).map(line => {
                    const [date, type] = line.split(',').map(item => item.trim());
                    return { date, type };
                }).filter(item => item.date && item.type);

                // 排序日期，確保由舊到新
                records.sort((a, b) => a.date.localeCompare(b.date));

                // 比對小於等於今日的最接近日期
                let currentType = '未找到對應週別';
                for (const record of records) {
                    if (record.date <= todayStr) {
                        currentType = record.type;
                    } else {
                        break;
                    }
                }

                document.getElementById('result').textContent = currentType;

            } catch (error) {
                const resultElem = document.getElementById('result');
                resultElem.textContent = '資料載入失敗';
                resultElem.classList.add('error');
                console.error(error);
            }
        }

        loadCalendar();
    </script>
</body>
</html>
