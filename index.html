<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人時間表</title>
    <!-- 引入 PapaParse 用於解析 CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        #status-bar {
            font-size: 1rem;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 4px;
            background-color: #e2e8f0;
        }
        .highlight-odd { background-color: #e0f2fe; color: #0369a1; }
        .highlight-even { background-color: #f0fdf4; color: #15803d; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
            font-size: 0.9rem;
            height: 60px;
            width: 16.66%;
        }
        th {
            background-color: #1e293b;
            color: #fff;
        }
        .time-col {
            background-color: #f1f5f9;
            font-weight: bold;
            width: 120px;
        }
        /* 依據你的要求設定的樣式 */
        .free-slot {
            background-color: #fef08a !important; /* 黃色標示空堂 */
            color: #333 !important;
        }
        .inactive-class {
            background-color: #fef08a !important; /* 非當週課堂的格子變黃色 */
            color: #94a3b8 !important;            /* 字體變成淺色 */
        }
        .active-class {
            background-color: #ffffff;
            color: #0f172a;
        }
        .holiday-notice {
            text-align: center;
            padding: 20px;
            background-color: #fef9c3;
            border: 1px solid #fde047;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #854d0e;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>教師個人自動時間表</h1>
        <div id="status-bar">載入中...</div>
    </header>

    <div id="notice-container"></div>
    <div id="table-container">載入時間表中...</div>
</div>

<script>
async function loadTimetableAndCalendar() {
    try {
        // 同時讀取兩個 CSV 檔案
        const [calRes, timeRes] = await Promise.all([
            fetch('calendar.csv?' + new Date().getTime()), // 加 timestamp 避免 cache
            fetch('timetable.csv?' + new Date().getTime())
        ]);

        const calText = await calRes.text();
        const timeText = await timeRes.text();

        // 解析 Calendar CSV
        Papa.parse(calText, {
            header: true,
            skipEmptyLines: true,
            complete: function(calResults) {
                // 解析 Timetable CSV
                Papa.parse(timeText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(timeResults) {
                        renderSchedule(calResults.data, timeResults.data);
                    }
                });
            }
        });
    } catch (error) {
        document.getElementById('status-bar').innerText = '載入檔案失敗';
        document.getElementById('table-container').innerText = '無法讀取 calendar.csv 或 timetable.csv，請確保它們與 index.html 放在同一資料夾內。';
        console.error(error);
    }
}

function renderSchedule(calendarData, timetableData) {
    const now = new Date();
    // 格式化為 YYYY-MM-DD 以便與 CSV 比較
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const todayStr = `${year}-${month}-${day}`;
    
    // 檢查是否為 2月13日之後 (上學期特定規則)
    // 假設學期結束/空堂日為 2月13日或之後
    const isAfterFeb13 = (month > 2) || (month == '02' && day >= '13');

    let currentWeekType = '未知';
    let isSchoolDay = false;

    // 在 calendar.csv 中尋找今天的單雙週記錄
    // 假設 calendar.csv 的欄位包含 Date, WeekType (或類似名稱，請根據實際調整)
    for (let row of calendarData) {
        // 尋找符合今天日期的行 (假設欄位名稱包含 Date / 日期 及 Type / 單雙週)
        const dateVal = row['Date'] || row['date'] || Object.values(row)[0];
        const typeVal = row['Week'] || row['week'] || row['Type'] || row['type'] || Object.values(row)[1];
        
        if (dateVal && dateVal.trim() === todayStr) {
            currentWeekType = typeVal ? typeVal.trim() : '';
            isSchoolDay = true;
            break;
        }
    }

    const statusBar = document.getElementById('status-bar');
    const noticeContainer = document.getElementById('notice-container');
    
    if (isAfterFeb13 && month == '02') {
        noticeContainer.innerHTML = `<div class="holiday-notice">提示：已過 2月13日，目前全日皆為空堂狀態。</div>`;
    } else {
        noticeContainer.innerHTML = '';
    }

    statusBar.innerHTML = `今日日期: ${todayStr} | 週期狀態: <span style="color: #2563eb;">${currentWeekType || '正常/假期'}</span>`;

    // 開始建立時間表 HTML
    let html = '<table>';
    
    if (timetableData.length > 0) {
        // 表頭
        html += '<thead><tr>';
        for (let cell of timetableData[0]) {
            html += `<th>${cell}</th>`;
        }
        html += '</tr></thead><tbody>';

        // 表身
        for (let i = 1; i < timetableData.length; i++) {
            html += '<tr>';
            for (let j = 0; j < timetableData[i].length; j++) {
                let cellContent = timetableData[i][j] ? timetableData[i][j].trim() : '';
                
                if (j === 0) {
                    // 時間欄位
                    html += `<td class="time-col">${cellContent}</td>`;
                } else {
                    if (isAfterFeb13 && month == '02') {
                        // 2月13日後全部變黃色空堂
                        html += `<td class="free-slot"></td>`;
                    } else {
                        // 檢查格子內是否標明單週或雙週
                        const isMarkedOdd = cellContent.includes('單週');
                        const isMarkedEven = cellContent.includes('雙週');

                        if (cellContent === '') {
                            // 本身就是空白的格子 -> 黃色
                            html += `<td class="free-slot"></td>`;
                        } else if (currentWeekType.includes('單')) {
                            // --- 如果今天是【單週】 ---
                            // 如果格子標明「雙週」，則該格變黃色且文字變淺色
                            if (isMarkedEven && !isMarkedOdd) {
                                html += `<td class="inactive-class" title="雙週課程（本週不上）">${cellContent}</td>`;
                            } else {
                                html += `<td class="active-class">${cellContent}</td>`;
                            }
                        } else if (currentWeekType.includes('雙')) {
                            // --- 如果今天是【雙週】 ---
                            // 如果格子標明「單週」，則該格變黃色且文字變淺色
                            if (isMarkedOdd && !isMarkedEven) {
                                html += `<td class="inactive-class" title="單週課程（本週不上）">${cellContent}</td>`;
                            } else {
                                html += `<td class="active-class">${cellContent}</td>`;
                            }
                        } else {
                            // 沒有特定單雙週資料時的預設顯示
                            html += `<td>${cellContent}</td>`;
                        }
                    }
                }
            }
            html += '</tr>';
        }
        html += '</tbody>';
    } else {
        html += '<tr><td>時間表資料為空</td></tr>';
    }
    html += '</table>';

    document.getElementById('table-container').innerHTML = html;
}

// 頁面載入時執行一次
loadTimetableAndCalendar();

// 每 5 分鐘 (300,000 毫秒) 自動更新一次
setInterval(loadTimetableAndCoachData = () => {
    loadTimetableAndCalendar();
}, 300000);
</script>

</body>
</html>
