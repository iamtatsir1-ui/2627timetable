<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師個人時間表 (自動單雙週)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            color: #007bff;
        }
        #status-bar {
            font-size: 14px;
            color: #555;
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
            font-size: 15px;
            transition: background-color 0.3s;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        /* 停用/非當週格子的樣式：淺灰底、深灰字 */
        .inactive-slot {
            background-color: #E0E0E0 !important;
            color: #757575 !important;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>教師個人時間表</h1>
        <div id="status-bar">正在載入系統資料...</div>
    </header>

    <div id="table-container">
        <!-- 課表將由 JS 動態載入 -->
    </div>

    <div class="footer">
        系統每 5 分鐘自動更新一次 | 依據 GitHub CSV 數據運行
    </div>
</div>

<script>
    // 簡單的 CSV 解析器 (支援引號內含逗號或換行)
    function parseCSV(text) {
        let lines = [];
        let row = [""];
        let inQuotes = false;
        
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let nextC = text[i+1];
            
            if (c === '"') {
                if (inQuotes && nextC === '"') {
                    row[row.length - 1] += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (c === ',' && !inQuotes) {
                row.push("");
            } else if ((c === '\r' && nextC === '\n') || c === '\n') {
                if (c === '\r') i++;
                lines.push(row);
                row = [""];
            } else {
                row[row.length - 1] += c;
            }
        }
        if (row.length > 1 || row[0] !== "") {
            lines.push(row);
        }
        return lines;
    }

    // 格式化日期為 YYYY-MM-DD
    function formatDateString(d) {
        let year = d.getFullYear();
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    async function loadDataAndRender() {
        const statusBar = document.getElementById('status-bar');
        const container = document.getElementById('table-container');
        const timestamp = new Date().getTime(); // 防止快取

        try {
            // 1. 以 ArrayBuffer 讀取檔案，並加上時間戳記防止快取
            const [calRes, timeRes] = await Promise.all([
                fetch(`calendar.csv?v=${timestamp}`),
                fetch(`timetable.csv?v=${timestamp}`)
            ]);

            if (!calRes.ok || !timeRes.ok) {
                throw new Error("無法讀取 GitHub 上的 CSV 檔案，請檢查檔名或路徑。");
            }

            const calBuffer = await calRes.arrayBuffer();
            const timeBuffer = await timeRes.arrayBuffer();

            // 智慧解碼函數：優先嘗試 UTF-8，失敗則自動切換為香港常用 Big5 (CP950)
            function decodeBuffer(buffer) {
                try {
                    const decoderUtf8 = new TextDecoder('utf-8', { fatal: true });
                    return decoderUtf8.decode(buffer);
                } catch (e) {
                    const decoderBig5 = new TextDecoder('big5');
                    return decoderBig5.decode(buffer);
                }
            }

            const calText = decodeBuffer(calBuffer);
            const timeText = decodeBuffer(timeBuffer);

            const calRows = parseCSV(calText);
            const timeRows = parseCSV(timeText);

            // 2. 判斷今天是單週還是雙週
            const today = new Date();
            const todayStr = formatDateString(today);
            
            let weekNumber = Math.ceil(((today - new Date(today.getFullYear(), 0, 1)) / 86400000 + new Date(today.getFullYear(), 0, 1).getDay()) / 7);
            let isSingleWeek = (weekNumber % 2 !== 0); // 奇數週為單週，偶數週為雙週
            let currentWeekType = isSingleWeek ? "單週" : "雙週";

            statusBar.innerHTML = `今天是：${todayStr} (${currentWeekType}) | 狀態：正常運作`;

            // 3. 渲染 timetable 課表
            let html = `<table>`;
            for (let r = 0; r < timeRows.length; r++) {
                let row = timeRows[r];
                html += `<tr>`;
                for (let c = 0; c < row.length; c++) {
                    let cellText = row[c] ? row[c].trim() : "";
                    let cellTag = (r === 0) ? 'th' : 'td';
                    
                    let extraClass = "";
                    if (r > 0) {
                        let isSingleOnly = cellText.includes("*單週");
                        let isDoubleOnly = cellText.includes("*雙週");

                        if (isSingleOnly && !isSingleWeek) {
                            extraClass = "inactive-slot";
                        } else if (isDoubleOnly && isSingleWeek) {
                            extraClass = "inactive-slot";
                        }
                    }

                    let formattedCellText = cellText.replace(/\n/g, '<br>');
                    html += `<${cellTag} class="${extraClass}">${formattedCellText}</${cellTag}>`;
                }
                html += `</tr>`;
            }
            html += `</table>`;

            container.innerHTML = html;

        } catch (error) {
            console.error(error);
            statusBar.innerHTML = `<span style="color: red;">讀取失敗：${error.message}</span>`;
        }
    }

    // 初次載入
    loadDataAndRender();

    // 每 5 分鐘 (300000 毫秒) 自動重新整理一次
    setInterval(loadDataAndRender, 300000);
</script>

</body>
</html>
